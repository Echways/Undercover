name: Setup Python
description: Install the interpreter and Poetry, restore the Poetry cache and install the project with dev dependencies.

inputs:
  python-version:
    required: false
    default: '3.13'
  poetry-version:
    required: false
    default: '2.4.1'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry
      shell: bash
      run: |
        curl -sSL https://install.python-poetry.org \
          | python3 - --version "${{ inputs.poetry-version }}"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry
        key: poetry-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('poetry.lock') }}

    - name: Install dependencies
      shell: bash
      env:
        POETRY_NO_INTERACTION: '1'
        POETRY_VIRTUALENVS_CREATE: 'false'
      run: poetry install --with dev
