version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    groups:
      aiogram:
        patterns: ['aiogram*']
      database:
        patterns: ['SQLAlchemy*', 'alembic', 'asyncpg']
      tooling:
        patterns: ['pytest*', 'ruff', 'mypy', 'testcontainers*']

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
