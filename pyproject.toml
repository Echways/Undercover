[project]
name = "undercover-bot"
version = "0.1.0"
description = "Undercover — Telegram-бот для игры в шпиона с одного телефона"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { file = "LICENSE" }

dependencies = [
    "aiogram[redis]==3.30.0",
    "aiogram-dialog==2.6.0",
    "SQLAlchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.19.1",
    "redis[hiredis]==8.1.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "Pillow==12.3.0",
    "structlog==26.1.0",
]

[project.scripts]
undercover-bot = "undercover.main:main"
undercover-seed = "undercover.db.seed:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "testcontainers[postgres,redis]==4.15.0",
    "ruff==0.16.4",
    "mypy==2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/undercover"]

[tool.alembic]
script_location = "undercover.db:migrations"
prepend_sys_path = ["src"]
path_separator = "os"
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
markers = [
    "integration: требует Docker — поднимает одноразовые PostgreSQL и Redis",
]

[tool.coverage.run]
source = ["src/undercover"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "ASYNC", "B", "C4", "E", "F", "I", "N",
    "PLC", "PLE", "PLW", "PTH", "RET", "RUF", "S", "SIM", "UP", "W",
]
ignore = ["ANN401", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
".github/scripts/*" = ["S314"]
"tests/*" = ["ARG", "ASYNC109", "S"]

[tool.ruff.lint.isort]
known-first-party = ["undercover"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
untyped_calls_exclude = ["aiogram_dialog"]
files = ["src", "tests", "tools", ".github/scripts"]
mypy_path = ["src", "tools"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "docker.*", "aiogram_dialog.*"]
ignore_missing_imports = true
