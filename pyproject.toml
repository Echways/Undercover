[project]
name = "undercover-bot"
version = "0.1.0"
description = "Undercover — Telegram-бот для игры в шпиона с одного телефона"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { file = "LICENSE" }

dependencies = [
    "aiogram[redis]==3.30.0",
    "aiogram-dialog==2.6.0",
    "SQLAlchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.19.1",
    "redis[hiredis]==7.4.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "Pillow==12.3.0",
    "structlog==26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "testcontainers[postgres,redis]==4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/undercover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
asyncio_mode = "auto"
markers = [
    "integration: требует Docker — поднимает одноразовые PostgreSQL и Redis",
]
